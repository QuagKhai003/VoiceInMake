<div class="conversation-interface">

  <!-- Language selector -->
  <div class="language-row">
    <span class="lang-label">Ngôn ngữ:</span>
    <div class="lang-options">
      <button class="lang-btn" [class.selected]="selectedLanguage === 'vi'" (click)="selectedLanguage = 'vi'">🇻🇳 Tiếng Việt</button>
      <button class="lang-btn" [class.selected]="selectedLanguage === 'en'" (click)="selectedLanguage = 'en'">🇺🇸 English</button>
      <button class="lang-btn" [class.selected]="selectedLanguage === 'auto'" (click)="selectedLanguage = 'auto'">🌐 Auto</button>
    </div>
  </div>

  <!-- Status ring + toggle button -->
  <div class="mic-area">
    <div class="state-ring" [ngClass]="sessionStateClass" [style.--amplitude]="amplitude">
      <div class="wave-ring" *ngIf="speechState === 'capturing'"></div>
      <div class="wave-ring delay" *ngIf="speechState === 'capturing'"></div>
      <button
        class="session-btn"
        [class.active]="conversationActive"
        [class.processing]="speechState === 'processing'"
        (click)="toggleConversation()">
        <span class="btn-icon">{{ conversationActive ? '⏹' : '🎙' }}</span>
      </button>
    </div>
  </div>

  <!-- Status label -->
  <p class="status-label" [class.error]="!!error">
    {{ error || statusLabel }}
  </p>

  <!-- Hint -->
  <p class="hint" *ngIf="!conversationActive && !error">
    Nhấn 🎙, nói tự do, dừng lại để gửi
  </p>
  <p class="hint active-hint" *ngIf="conversationActive && speechState === 'listening'">
    Đang lắng nghe — hãy nói bất cứ điều gì
  </p>

</div>
